  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-cadence}:${POSTGRES_PASSWORD:-cadence}@db:5432/${POSTGRES_DB:-cadence}
  #   ports:
  #     - "4000:4000"

  # --- Split later (AGENTS.md §7): a background render / understanding worker --
  # worker:
  #   build:
  #     context: .
  #     dockerfile: apps/worker/Dockerfile
  #   depends_on:
